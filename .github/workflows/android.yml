# Builds the Android app (APK) with LÖVE for Android, for handhelds such as the
# AYN Thor. Runs by hand (Actions tab) or when a tag like v1.0.0 is pushed; a tag
# also publishes the APK on the repository's Releases page.
#
# Signing: the secrets ANDROID_KEYSTORE_B64 (PKCS#12 keystore, base64) and
# ANDROID_KEYSTORE_PASS. The same key must sign every version, or Android
# refuses to install an update over the previous one.
name: Android

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  LOVE_ANDROID_REF: 11.5a
  APP_ID: ch.lafleurstudio.toimemetusais
  # "Toi-même tu sais" in UTF-8
  APP_NAME_BYTES: 84,111,105,45,109,195,170,109,101,32,116,117,32,115,97,105,115
  NDK_VERSION: 25.2.9519653
  BUILD_TOOLS: 34.0.0

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the game
        uses: actions/checkout@v4

      - name: Checkout LÖVE for Android
        uses: actions/checkout@v4
        with:
          repository: love2d/love-android
          ref: ${{ env.LOVE_ANDROID_REF }}
          path: love-android
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install the Android NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" "build-tools;$BUILD_TOOLS" > /dev/null

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then name="${GITHUB_REF#refs/tags/v}"; else name="0.0.${GITHUB_RUN_NUMBER}-dev"; fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

      - name: Package the game
        run: |
          mkdir -p love-android/app/src/embed/assets
          zip -X -r -q love-android/app/src/embed/assets/game.love main.lua conf.lua src words assets
          cd love-android
          {
            echo "app.name_byte_array=$APP_NAME_BYTES"
            echo "app.application_id=$APP_ID"
            echo "app.orientation=sensorLandscape"
            echo "app.version_code=${{ steps.version.outputs.code }}"
            echo "app.version_name=${{ steps.version.outputs.name }}"
            sed -n '/^# No need to modify/,$p' gradle.properties
          } > gradle.properties.new
          mv gradle.properties.new gradle.properties
          cat gradle.properties

      - name: App icon
        run: |
          pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          src = Image.open("assets/logo/logo-512.png").convert("RGBA")
          for folder, size in {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}.items():
              src.resize((size, size), Image.LANCZOS).save(f"love-android/app/src/main/res/drawable-{folder}/love.png")
          PY

      - name: Build
        working-directory: love-android
        run: bash ./gradlew --no-daemon assembleEmbedNoRecordRelease

      - name: Sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "Missing signing secrets"; exit 1; fi
          BT="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          echo "$KEYSTORE_B64" | base64 -d > release.p12
          IN=love-android/app/build/outputs/apk/embedNoRecord/release/app-embed-noRecord-release-unsigned.apk
          OUT="Toi-meme-tu-sais-${{ steps.version.outputs.name }}.apk"
          "$BT/zipalign" -p -f 4 "$IN" aligned.apk
          "$BT/apksigner" sign --ks release.p12 --ks-type PKCS12 --ks-pass env:KEYSTORE_PASS --out "$OUT" aligned.apk
          "$BT/apksigner" verify "$OUT"
          rm -f release.p12 aligned.apk
          echo "APK=$OUT" >> "$GITHUB_ENV"

      - name: Keep the APK (Actions run)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK }}
          path: ${{ env.APK }}

      - name: Publish on Releases
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$APK" --title "Toi-même tu sais $GITHUB_REF_NAME" \
            --notes "Android app (AYN Thor and other Android handhelds). Download the .apk on the device and open it to install."
